name: NAKAMA Backend CI

on:
  push:
    branches: [ main, develop, design_1 ]
  pull_request:
    branches: [ main, develop, design_1 ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nakama
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: server

      - name: Push Schema to Test DB
        run: npx prisma db push --skip-generate
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nakama
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'test-access-secret-hardening-123' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'test-refresh-secret-hardening-123' }}

      - name: Run Integration Tests
        run: npm run test:integration -- run
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nakama
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'test-access-secret-hardening-123' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'test-refresh-secret-hardening-123' }}
          NODE_ENV: test
          PORT: 5000
